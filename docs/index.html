<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>성적 처리 통합 관리 시스템 - 프로토타입</title>
<style>

:root{
  --navy:#1F3864; --accent:#2E5395; --accent-light:#EAF0FA; --grey:#F2F2F2;
  --border:#D9D9D9; --text:#222; --muted:#666; --ok:#2E7D32; --bad:#C62828; --warn:#B26A00;
  --radius:10px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Pretendard','Malgun Gothic','맑은 고딕',sans-serif;background:#F6F7FA;color:var(--text);}
header.topbar{background:var(--navy);color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;}
header.topbar .brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;}
header.topbar .tag{font-size:10px;background:#E8A33D;color:#3a2600;padding:2px 7px;border-radius:20px;font-weight:700;letter-spacing:.5px;}
.mode-switch button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;padding:7px 16px;border-radius:20px;cursor:pointer;font-size:13px;margin-left:8px;}
.mode-switch button.active{background:#fff;color:var(--navy);font-weight:700;border-color:#fff;}
nav.tabs{display:flex;gap:4px;background:#fff;padding:0 18px;border-bottom:1px solid var(--border);overflow-x:auto;}
nav.tabs button{background:transparent;border:none;padding:13px 16px;font-size:13.5px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;}
nav.tabs button.active{color:var(--navy);font-weight:700;border-bottom-color:var(--accent);}
main{padding:20px;max-width:1180px;margin:0 auto;}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;}
.card h3{margin:0 0 12px;font-size:14.5px;color:var(--navy);}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
.stat{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
.stat .label{font-size:12px;color:var(--muted);margin-bottom:6px;}
.stat .value{font-size:22px;font-weight:800;color:var(--navy);}
.metabar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.metabar span{background:var(--accent-light);color:var(--accent);font-size:12.5px;padding:6px 12px;border-radius:20px;font-weight:600;}
.checklist{display:flex;flex-wrap:wrap;gap:10px;}
.checklist .step{display:flex;align-items:center;gap:8px;background:#F4FAF4;border:1px solid #CDE8CD;color:var(--ok);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;}
.checklist .step .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);}
table{width:100%;border-collapse:collapse;font-size:13px;}
table th{background:var(--accent);color:#fff;text-align:left;padding:8px 10px;font-weight:600;position:sticky;top:0;}
table td{padding:7px 10px;border-bottom:1px solid #EEE;}
table tr:hover td{background:#F7F9FD;}
.searchbar{display:flex;gap:8px;margin-bottom:12px;}
.searchbar input{flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;}
.searchbar button, .btn{padding:9px 16px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;font-size:13px;}
.btn.secondary{background:#fff;border:1px solid var(--accent);color:var(--accent);}
.table-wrap{max-height:520px;overflow:auto;border:1px solid var(--border);border-radius:8px;}
.file-slide{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity;}
.file-card{scroll-snap-align:start;flex:0 0 210px;border:1px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;background:#fff;position:relative;}
.file-card:hover{border-color:var(--accent);}
.file-card.checked{background:var(--accent-light);border-color:var(--accent);}
.file-card .fc-check{position:absolute;top:8px;right:10px;color:var(--accent);font-weight:800;font-size:13px;}
.file-card .fc-name{font-weight:700;font-size:12.5px;margin-bottom:8px;word-break:break-all;padding-right:16px;}
.file-card .fc-meta{font-size:11.5px;color:var(--muted);margin-bottom:6px;}
.file-card .fc-data{font-size:11.5px;}
.pager{display:flex;gap:6px;margin-top:10px;justify-content:center;flex-wrap:wrap;}
.pager button{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:12px;}
.pager button.active{background:var(--navy);color:#fff;border-color:var(--navy);}

.bar-row{display:grid;grid-template-columns:50px 40px 1fr 60px;gap:8px;align-items:center;padding:5px 0;font-size:12.5px;border-bottom:1px solid #F0F0F0;}
.bar-row.worst{background:#FFF4E9;}
.bar-track{background:#EEF1F6;border-radius:4px;height:14px;overflow:hidden;}
.bar-fill{background:var(--accent);height:100%;}
.bar-fill.low{background:var(--bad);}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.pill.voca{background:#EAF0FA;color:var(--accent);}
.pill.gram{background:#FDEFE3;color:#B26A00;}
.pill.read{background:#EAF7EE;color:var(--ok);}
.report-header{border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;background:linear-gradient(135deg,var(--navy),var(--accent));color:#fff;}
.report-header .rtitle{font-size:15px;font-weight:700;margin-bottom:4px;}
.report-header .rsub{font-size:12.5px;opacity:.85;margin-bottom:10px;}
.report-header .rstudent{display:flex;gap:20px;font-size:14px;flex-wrap:wrap;}
.report-header .rstudent b{font-size:16px;}
.univ-tabs{display:flex;gap:6px;margin-bottom:14px;}
.univ-tabs button{padding:7px 14px;border-radius:20px;border:1px solid var(--accent);background:#fff;color:var(--accent);font-size:12.5px;cursor:pointer;font-weight:600;}
.univ-tabs button.active{background:var(--accent);color:#fff;}
.oxgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;}
.oxcell{border:1px solid var(--border);border-radius:6px;text-align:center;padding:6px 2px;font-size:11px;}
.oxcell{position:relative;cursor:default;}
.oxcell:hover{border-color:var(--accent);z-index:5;}
.oxcell::after{content:attr(data-tip);position:absolute;bottom:100%;left:50%;transform:translateX(-50%) translateY(-4px);background:var(--navy);color:#fff;padding:5px 9px;border-radius:6px;font-size:11px;white-space:nowrap;z-index:30;opacity:0;pointer-events:none;transition:opacity .1s;}
.oxcell:hover::after{opacity:1;}

.oxcell .qno{color:var(--muted);font-size:10px;}
.oxcell .mark{font-size:15px;font-weight:800;}
.oxcell.correct{background:#EAF7EE;} .oxcell.correct .mark{color:var(--ok);}
.oxcell.wrong{background:#FDEEEE;} .oxcell.wrong .mark{color:var(--bad);}
.oxcell.blank{background:#F5F5F5;color:#bbb;}
.scorebig{display:flex;gap:24px;flex-wrap:wrap;}
.scorebig .item{text-align:center;flex:1;min-width:100px;}
.scorebig .item .num{font-size:28px;font-weight:800;color:var(--navy);}
.scorebig .item .lab{font-size:12px;color:var(--muted);}
.dist-chart{display:flex;align-items:flex-end;gap:5px;height:160px;margin-top:10px;padding-bottom:6px;}
.dist-chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.dist-chart .bar{width:100%;background:#C9D6EA;border-radius:3px 3px 0 0;}
.dist-chart .bar.me{background:var(--accent) !important;}
.dist-chart .lab{font-size:10px;color:var(--muted);margin-top:6px;writing-mode:horizontal-tb;white-space:nowrap;}
.dist-chart .cnt{font-size:10px;color:var(--navy);font-weight:700;}
.match-table td.pos{color:var(--ok);font-weight:700;}
.match-table td.neg{color:var(--bad);font-weight:700;}
.entry-screen{max-width:420px;margin:60px auto;text-align:center;}
.entry-screen .logo{font-size:20px;font-weight:800;color:var(--navy);margin-bottom:6px;}
.entry-screen input{width:100%;padding:12px 14px;font-size:15px;border:1px solid var(--border);border-radius:8px;margin:14px 0;}
.entry-screen .btn{width:100%;padding:12px;font-size:14.5px;}
.subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.subtabs button{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:13px;cursor:pointer;}
.subtabs button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.note{background:#FFF9E8;border:1px solid #F0DFA0;color:#7A5C00;padding:10px 14px;border-radius:8px;font-size:12.5px;margin-bottom:12px;}
.qz-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #F0F0F0;font-size:13px;}
.qz-row .opts{display:flex;gap:5px;}
.qz-row .opts button{width:30px;height:30px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;font-weight:700;font-size:12px;}
.qz-row .opts button.sel{background:var(--accent);color:#fff;border-color:var(--accent);}
.empty{color:var(--muted);text-align:center;padding:30px;font-size:13px;}
.flag{color:var(--bad);font-size:11px;font-weight:700;}

</style>
</head>
<body>
<div id="app"></div>
<script>
window.addEventListener('error', function(e){
  var el = document.getElementById('app');
  if (el){
    var msg = (e && e.message) ? e.message : '알 수 없는 오류';
    var stack = (e && e.error && e.error.stack) ? e.error.stack : '';
    el.innerHTML = '<div style="padding:40px;font-family:Consolas,monospace;white-space:pre-wrap;color:#c62828;font-size:13px;line-height:1.6">'
      + '앱 실행 중 오류가 발생했습니다. 아래 메시지를 캡처해서 알려주세요.\n\n'
      + '메시지: ' + msg + '\n'
      + '위치: ' + (e && e.filename ? e.filename : '') + ':' + (e && e.lineno) + ':' + (e && e.colno) + '\n\n'
      + stack + '</div>';
  }
});

function $(sel, root){ return (root||document).querySelector(sel); }
function esc(s){ return (s===null||s===undefined) ? '' : String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

// ================== 실제 백엔드 연동 (API 클라이언트) ==================
// 배포된 실제 서버 주소. 다른 주소로 옮기면 이 값만 바꾸면 됩니다.
var API_BASE = 'https://database-backend-production-077e.up.railway.app';
var TOKEN_KEY = 'sungjuk_admin_token';
var ADMIN_KEY = 'sungjuk_admin_info';

function loadStoredAuth(){
  try {
    var t = localStorage.getItem(TOKEN_KEY);
    var a = localStorage.getItem(ADMIN_KEY);
    return { token: t || null, admin: a ? JSON.parse(a) : null };
  } catch(err){ return { token:null, admin:null }; }
}
function storeAuth(token, admin){
  try {
    if (token) localStorage.setItem(TOKEN_KEY, token); else localStorage.removeItem(TOKEN_KEY);
    if (admin) localStorage.setItem(ADMIN_KEY, JSON.stringify(admin)); else localStorage.removeItem(ADMIN_KEY);
  } catch(err){}
}

// 공통 fetch 래퍼: 토큰 자동 첨부, JSON 파싱, 실패 시 사람이 읽을 에러 메시지로 정리
function apiFetch(path, opts){
  opts = opts || {};
  var headers = opts.headers || {};
  if (!(opts.body instanceof FormData) && opts.body){
    headers['Content-Type'] = 'application/json';
  }
  if (state.liveToken) headers['Authorization'] = 'Bearer ' + state.liveToken;
  return fetch(API_BASE + path, {
    method: opts.method || 'GET',
    headers: headers,
    body: opts.body
  }).then(function(res){
    return res.text().then(function(text){
      var data = null;
      try { data = text ? JSON.parse(text) : null; } catch(err){ data = null; }
      if (!res.ok){
        var msg = (data && data.error) ? data.error : ('요청 실패 (HTTP ' + res.status + ')');
        var e = new Error(msg);
        e.status = res.status;
        throw e;
      }
      return data;
    });
  });
}

function apiLogin(username, password){
  return apiFetch('/api/admin/login', { method:'POST', body: JSON.stringify({ username:username, password:password }) });
}
function apiListExamRounds(){
  return apiFetch('/api/exam-rounds');
}
function apiQuickCreateRound(payload){
  return apiFetch('/api/exam-rounds/quick-create', { method:'POST', body: JSON.stringify(payload) });
}
function apiPublishRounds(ids){
  return apiFetch('/api/exam-rounds/publish', { method:'POST', body: JSON.stringify({ exam_round_ids: ids }) });
}
function apiUploadFile(examRoundId, kind, file, extra){
  var pathByKind = { omr:'omr-upload', answerKey:'answer-key-upload', roster:'roster-upload' };
  var fd = new FormData();
  fd.append('file', file);
  Object.keys(extra||{}).forEach(function(k){ fd.append(k, extra[k]); });
  return apiFetch('/api/exam-rounds/'+examRoundId+'/'+pathByKind[kind], { method:'POST', body: fd });
}
function apiGetResults(examRoundId){
  return apiFetch('/api/exam-rounds/'+examRoundId+'/results');
}
function apiGetCombinedResults(ids){
  return apiFetch('/api/exam-rounds/combined-results?ids=' + ids.join(','));
}
function apiGetStudentAnswers(examRoundId, examNo){
  return apiFetch('/api/exam-rounds/'+examRoundId+'/students/'+encodeURIComponent(examNo)+'/answers');
}
function apiGetQuestionStats(examRoundId){
  return apiFetch('/api/exam-rounds/'+examRoundId+'/question-stats');
}
function apiGetDashboardSummary(){
  return apiFetch('/api/exam-rounds/dashboard-summary');
}
function apiGetStudentHistory(examNo){
  return apiFetch('/api/students/'+encodeURIComponent(examNo)+'/history');
}
function apiGetUnivMaster(params){
  var qs = Object.keys(params||{}).filter(function(k){ return params[k]; }).map(function(k){
    return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);
  }).join('&');
  return apiFetch('/api/university-master' + (qs?('?'+qs):''));
}
function apiUploadUnivBulk(file, year, sheetIndex){
  var fd = new FormData();
  fd.append('file', file);
  fd.append('year', year);
  if (sheetIndex!==undefined && sheetIndex!==null) fd.append('sheetIndex', sheetIndex);
  return apiFetch('/api/university-master/bulk-upload', { method:'POST', body: fd });
}
// ---- 학생 포털(실제, 로그인 불필요) ----
function apiPortalLookup(examNo){

}

function apiPortalRoundQuestions(roundId){

function apiPortalSelfIssue(name){

function apiPortalWrongQuestions(examNo){

// ---------- top-level render ----------
function renderApp(){
  var root = $('#app');

  var active = document.activeElement;
  var focusId = (active && active.id) ? active.id : null;
  var selStart = focusId && active.selectionStart!==undefined ? active.selectionStart : null;
  var selEnd = focusId && active.selectionEnd!==undefined ? active.selectionEnd : null;

  var html = '';
  html += '<header class="topbar">'
    + '<div class="brand">성적 처리 통합 관리 시스템 <span class="tag">PROTOTYPE</span></div>'
    + '<div class="mode-switch">'
    + '<button data-act="setMode" data-mode="admin" class="' + (state.mode==='admin'?'active':'') + '">관리자</button>'
    + '<button data-act="setMode" data-mode="studentLive" class="' + (state.mode==='studentLive'?'active':'') + '">학생 포털</button>'
    + '</div></header>';

  if (state.mode === 'admin'){
    html += '<main>' + renderLiveTab() + '</main>';
  } else {
    html += '<main>' + renderStudentPortalLive() + '</main>';
  }
  root.innerHTML = html;

  if (focusId){
    var el = document.getElementById(focusId);
    if (el && typeof el.focus === 'function'){
      el.focus();
      if (selStart!==null && el.setSelectionRange){
        try { el.setSelectionRange(selStart, selEnd); } catch(err){}
      }
    }
  }
}





function statCard(label, value){
  return '<div class="stat"><div class="label">'+esc(label)+'</div><div class="value">'+esc(value)+'</div></div>';
}




function renderLiveTab(){
  if (!state.liveToken){
    return renderLiveLogin();
  }
  var html = '';
  html += '<div class="card" style="display:flex;justify-content:space-between;align-items:center">'
    + '<div>관리자 <b>'+esc(state.liveAdmin ? state.liveAdmin.username : '')+'</b>님으로 로그인됨 (실제 서버: '+esc(API_BASE)+')</div>'
    + '<button class="btn secondary" data-act="liveLogout">로그아웃</button>'
    + '</div>';

  if (state.liveMessage){
    var isErr = state.liveMessageType==='error';
    html += '<div class="note" style="'+(isErr?'border-color:#EBB;background:#FDEEEE;color:var(--bad)':'border-color:#CDE8CD;background:#F4FAF4;color:var(--ok)')+'">'+esc(state.liveMessage)+'</div>';
  }

  html += '<div class="subtabs">';
  [['rounds','회차관리'],['results','성적표'],['students','학생조회'],['dashboard','대시보드'],['questions','문항통계'],['univ','대학DB']].forEach(function(t){
    html += '<button data-act="setLiveSubtab" data-sub="'+t[0]+'" class="'+(state.liveSubtab===t[0]?'active':'')+'">'+t[1]+'</button>';
  });
  html += '</div>';

  if (state.liveSubtab==='rounds'){
    html += renderLiveNewRoundForm();
    html += renderLiveRoundsList();
  } else if (state.liveSubtab==='results'){
    html += renderLiveResultsTab();
  } else if (state.liveSubtab==='students'){
    html += renderLiveStudentsTab();
  } else if (state.liveSubtab==='dashboard'){
    html += renderLiveDashboardTab();
  } else if (state.liveSubtab==='questions'){
    html += renderLiveQuestionsTab();
  } else if (state.liveSubtab==='univ'){
    html += renderLiveUnivTab();
  }
  return html;
}

function liveRoundOptionsHtml(selectedId){
  var html = '<option value="">회차 선택</option>';
  (state.liveRounds||[]).forEach(function(r){
    html += '<option value="'+r.id+'" '+(String(selectedId)===String(r.id)?'selected':'')+'>'
      + '#'+r.id+' '+esc(r.professor_name)+'/'+esc(r.class_name)+' '+esc(r.round_label)+' ('+esc(r.exam_year)+')'
      + (r.status==='published'?' [발행됨]':' [초안]') + '</option>';
  });
  return html;
}

function renderLiveResultsTab(){
  var html = '<div class="card"><h3>성적표 (실제 DB)</h3>';
  if (!state.liveRoundsLoaded || state.liveRounds.length===0){
    html += '<div class="empty">먼저 "회차관리" 탭에서 새로고침을 눌러 회차 목록을 불러와주세요.</div></div>';

        } catch(err){ areas = '-'; }
        var rank = st.combined_rank!==undefined ? st.combined_rank : st.overall_rank;
        var pct = st.combined_percentile!==undefined ? st.combined_percentile : st.percentile;

          + '<td>'+(expanded?'▼':'▶')+'</td><td>'+(rank||'-')+'</td><td>'+esc(st.exam_no)+'</td><td>'+name+'</td>'
          + '<td>'+esc(st.class_name||'-')+'</td>'
          + '<td>'+st.total_score+'</td><td>'+(pct!==null&&pct!==undefined?pct+'%':'-')+'</td><td style="font-size:12px;color:var(--muted)">'+esc(areas)+'</td></tr>';
        if (expanded){
          html += '<tr><td colspan="8" style="padding:0"><div style="padding:14px;background:var(--grey)">' + renderOxGridForKey(key) + '</div></td></tr>';
        }
      });
      html += '</tbody></table></div>';
    }

  return html;
}

// 정오표(OX 격자) — 관리자 성적표/학생 포털에서 공용으로 사용
function renderOxGridForKey(key){
  var answers = state.liveStudentAnswersCache[key];
  if (!answers){
    return '<div class="empty">불러오는 중입니다...</div>';
  }
  return renderOxGrid(answers);
}
function renderOxGrid(answers){
  if (!answers || answers.length===0) return '<div class="empty">문항 데이터가 없습니다.</div>';
  var html = '<div class="oxgrid">';
  answers.forEach(function(q){
    var cls = q.isCorrect===null || q.isCorrect===undefined ? 'blank' : (q.isCorrect?'correct':'wrong');
    var mark = q.isCorrect===null || q.isCorrect===undefined ? '-' : (q.isCorrect?'○':'Ｘ');
    html += '<div class="oxcell '+cls+'" data-tip="배점 '+q.point+'점 · 정답률 '+(q.correctRate!==null?q.correctRate+'%':'-')+'">'
      + '<div class="qno">'+q.questionNo+'</div><div class="mark">'+mark+'</div></div>';
  });
  html += '</div>';
  return html;
}

  html += '<input id="pvExamInput" placeholder="수험번호 입력 (예: K01023948)" value="'+esc(state.pvExamNo)+'"/>';
  if (state.pvError){ html += '<div class="note" style="border-color:#EBB;background:#FDEEEE;color:var(--bad)">'+esc(state.pvError)+'</div>'; }
  html += '<button class="btn" data-act="pvLookup" '+(state.pvLoading?'disabled':'')+'>'+(state.pvLoading?'조회 중...':'성적 조회')+'</button>';
  html += '<div style="margin-top:22px;border-top:1px solid var(--border);padding-top:18px">';
  html += '<div style="font-size:13px;color:var(--muted);margin-bottom:10px">학원 등록 없이 답안을 직접 입력해 실제 서버 기준으로 채점받고 싶다면?</div>';
  html += '<button class="btn secondary" data-act="pvStartSelf" '+(state.pvLoading?'disabled':'')+'>자가 답안 입력(셀프 채점) 시작하기</button>';
  html += '</div></div>';

function pillClassForArea(tag){
  var t = String(tag||'');
  if (t.indexOf('어휘')>-1 || t==='어') return 'voca';
  if (t.indexOf('문법')>-1 || t==='문') return 'gram';
  if (t.indexOf('독해')>-1 || t==='독') return 'read';
  return 'gram';
}

function renderPortalLiveLookup(){
  var html = '<div class="card" style="display:flex;justify-content:space-between;align-items:center">'
    + '<div>수험번호 <b>'+esc(state.pvExamNo)+'</b> 조회 결과</div>'
    + '<button class="btn secondary" data-act="pvBack">다른 수험번호로 조회</button></div>';

  var rows = state.pvLookupResults || [];
  if (rows.length===0){
    html += '<div class="card"><div class="empty">발행된 회차 중 이 수험번호로 채점된 성적이 없습니다. (아직 관리자가 발행하지 않았거나, 명단에 등록되지 않았을 수 있습니다)</div></div>';
    return html;
  }

  html += '<div class="subtabs">';
  [['report','성적표'],['wrong','오답노트'],['univ','대학 매칭'],['trend','역대 성적 비교']].forEach(function(t){
    html += '<button data-act="pvSetSub" data-sub="'+t[0]+'" class="'+(state.pvSubtab===t[0]?'active':'')+'">'+t[1]+'</button>';
  });

function renderPvReportTab(rows){
  var html = '';
  rows.forEach(function(r){
    var name = r.real_name || r.masked_name || '-';
    var areaScores = r.area_scores;
    try { if (typeof areaScores==='string') areaScores = JSON.parse(areaScores); } catch(err){ areaScores = {}; }
    areaScores = areaScores || {};

    html += '<div class="card">';
    html += '<h3>'+esc(r.exam_year)+' · '+esc(r.round_label)+' <span style="font-weight:400;color:var(--muted);font-size:13px">('+esc(name)+')</span></h3>';
    html += '<div class="scorebig">'
      + '<div class="item"><div class="num">'+r.total_score+'</div><div class="lab">총점</div></div>'
      + '<div class="item"><div class="num">'+(r.percentile!==null?r.percentile+'%':'-')+'</div><div class="lab">백분위</div></div>'
      + '<div class="item"><div class="num">'+(r.overall_rank!==null&&r.overall_rank!==undefined?r.overall_rank:'-')+'</div><div class="lab">전체 석차</div></div>'
      + '</div>';

    var areaKeys = Object.keys(areaScores);
    if (areaKeys.length>0){
      html += '<table><thead><tr><th>영역</th><th>취득점수</th><th>총점수</th><th>취득률</th></tr></thead><tbody>';
      areaKeys.forEach(function(k){
        var b = areaScores[k];
        var pct = b.total>0 ? Math.round((b.earned/b.total)*1000)/10 : 0;
        html += '<tr><td><span class="pill '+pillClassForArea(k)+'">'+esc(k)+'</span></td><td>'+b.earned+'</td><td>'+b.total+'</td><td>'+pct+'%</td></tr>';
      });
      html += '</tbody></table>';
    }
    if (r.exam_round_id){
      html += '<div style="margin-top:10px"><button class="btn secondary" data-act="pvToggleAnswers" data-round-id="'+r.exam_round_id+'">'
        + (state.pvExpandedAnswersRoundId===r.exam_round_id ? '정오표 닫기' : '정오표 보기') + '</button></div>';
      if (state.pvExpandedAnswersRoundId===r.exam_round_id){
        var pvAns = state.pvAnswersCache[r.exam_round_id];
        html += '<div style="margin-top:10px">' + (pvAns ? renderOxGrid(pvAns) : '<div class="empty">불러오는 중입니다...</div>') + '</div>';
      }
    }
    html += '</div>';
  });
  return html;
}

    areaKeys2.forEach(function(k){

  return html;
}

// ---------- actions ----------
function setState(patch){ Object.assign(state, patch); renderApp(); }

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act');
  if (act==='setMode') setState({mode: el.getAttribute('data-mode')});
  // ---- 회차관리(실제연동) ----
  else if (act==='liveLogin'){
    var luName = $('#liveUsername').value.trim();
    var luPass = $('#livePassword').value;
    if (!luName || !luPass){ setState({liveLoginError:'아이디와 비밀번호를 입력해주세요.'}); return; }
    setState({liveLoading:true, liveLoginError:''});
    apiLogin(luName, luPass).then(function(res){
      storeAuth(res.token, res.admin);
      setState({liveToken:res.token, liveAdmin:res.admin, liveLoading:false, liveLoginError:''});
    }).catch(function(err){
      setState({liveLoading:false, liveLoginError: err.message});
    });
  }
  else if (act==='liveLogout'){
    storeAuth(null, null);
    setState({liveToken:null, liveAdmin:null, liveRounds:[], liveRoundsLoaded:false, liveMessage:'', liveExpandedRoundId:null});
  }
  else if (act==='liveCreateRound'){
    var payload = {
      academy_name: $('#liveNewAcademy').value.trim(),
      professor_name: $('#liveNewProfessor').value.trim(),
      class_name: $('#liveNewClass').value.trim(),
      round_label: $('#liveNewRoundLabel').value.trim(),
      exam_year: parseInt($('#liveNewYear').value, 10)
    };
    if (!payload.academy_name || !payload.professor_name || !payload.class_name || !payload.round_label || !payload.exam_year){
      setState({liveMessage:'모든 항목을 입력해주세요.', liveMessageType:'error'});
      return;
    }
    setState({liveLoading:true});
    apiQuickCreateRound(payload).then(function(round){
      return apiListExamRounds().then(function(list){
        setState({liveLoading:false, liveRounds:list, liveRoundsLoaded:true, liveMessage:'회차가 생성되었습니다 (ID: '+round.id+').', liveMessageType:'ok'});
      });
    }).catch(function(err){
      setState({liveLoading:false, liveMessage:err.message, liveMessageType:'error'});
    });
  }
  else if (act==='liveRefreshRounds'){
    setState({liveLoading:true});
    apiListExamRounds().then(function(list){
      setState({liveRounds:list, liveRoundsLoaded:true, liveLoading:false});
    }).catch(function(err){
      setState({liveLoading:false, liveMessage:err.message, liveMessageType:'error'});
    });
  }
  else if (act==='liveToggleRound'){
    var rid = parseInt(el.getAttribute('data-id'), 10);
    setState({liveExpandedRoundId: state.liveExpandedRoundId===rid ? null : rid});
  }
  else if (act==='livePublishRound'){
    var pid = parseInt(el.getAttribute('data-id'), 10);
    setState({liveLoading:true});
    apiPublishRounds([pid]).then(function(){
      return apiListExamRounds().then(function(list){
        setState({liveRounds:list, liveLoading:false, liveMessage:'회차가 발행되었습니다.', liveMessageType:'ok'});
      });
    }).catch(function(err){
      setState({liveLoading:false, liveMessage:err.message, liveMessageType:'error'});
    });
  }
  else if (act==='setLiveSubtab'){
    setState({liveSubtab: el.getAttribute('data-sub')});
  }
  else if (act==='liveToggleResultRound'){
    var trId = parseInt(el.getAttribute('data-id'), 10);
    var trArr = state.liveResultsRoundIds.slice();
    var trIdx = trArr.indexOf(trId);
    if (trIdx>-1) trArr.splice(trIdx,1); else trArr.push(trId);
    setState({liveResultsRoundIds: trArr});
  }
  else if (act==='liveLoadResults'){
    var ids = state.liveResultsRoundIds;
    if (!ids || ids.length===0){ setState({liveMessage:'회차를 하나 이상 체크해주세요.', liveMessageType:'error'}); return; }
    setState({liveLoading:true, liveExpandedStudentKey:null, liveStudentAnswersCache:{}});
    apiGetCombinedResults(ids).then(function(res){
      setState({liveLoading:false, liveResults:res});
    }).catch(function(err){
      setState({liveLoading:false, liveMessage:err.message, liveMessageType:'error'});
    });
  }
  else if (act==='liveToggleNameVisible'){
    setState({liveResultsNameVisible: !state.liveResultsNameVisible});
  }
  else if (act==='liveToggleStudentAnswers'){
    var tsRoundId = el.getAttribute('data-round-id');
    var tsExamNo = el.getAttribute('data-exam-no');
    var tsKey = tsRoundId+'|'+tsExamNo;
    if (state.liveExpandedStudentKey === tsKey){
      setState({liveExpandedStudentKey: null});
      return;
    }
    setState({liveExpandedStudentKey: tsKey});
    if (!state.liveStudentAnswersCache[tsKey]){
      apiGetStudentAnswers(tsRoundId, tsExamNo).then(function(answers){
        var cache = Object.assign({}, state.liveStudentAnswersCache);
        cache[tsKey] = answers;
        setState({liveStudentAnswersCache: cache});
      }).catch(function(err){
        setState({liveMessage:err.message, liveMessageType:'error'});
      });
    }
  }
  else if (act==='liveSearchStudent'){
    var exNo = $('#liveStudentExamInput').value.trim();
    if (!exNo){ return; }
    setState({liveLoading:true, liveStudentSearchExamNo: exNo});
    apiGetStudentHistory(exNo).then(function(hist){
      setState({liveLoading:false, liveStudentHistory:hist});
    }).catch(function(err){
      setState({liveLoading:false, liveMessage:err.message, liveMessageType:'error'});
    });
  }
  else if (act==='liveLoadDashboard'){
    setState({liveLoading:true});
    apiGetDashboardSummary().then(function(d){
      setState({liveLoading:false, liveDashboard:d});
    }).catch(function(err){
      setState({liveLoading:false, liveMessage:err.message, liveMessageType:'error'});
    });
  }
  else if (act==='liveLoadQuestionStats'){
    var qsel = $('#liveQuestionsRoundSelect');
    var qrid = qsel ? qsel.value : '';
    if (!qrid){ setState({liveMessage:'회차를 선택해주세요.', liveMessageType:'error'}); return; }
    setState({liveLoading:true, liveResultsRoundId: qrid});
    apiGetQuestionStats(qrid).then(function(qs){
      setState({liveLoading:false, liveQuestionStats:qs});
    }).catch(function(err){
      setState({liveLoading:false, liveMessage:err.message, liveMessageType:'error'});
    });
  }
  else if (act==='liveLoadUniv'){
    var uy = $('#liveUnivYearInput').value.trim();
    var us = $('#liveUnivSearchInput').value.trim();
    setState({liveLoading:true, liveUnivYear:uy, liveUnivSearch:us});
    apiGetUnivMaster({ year: uy, univ_name: us }).then(function(list){
      setState({liveLoading:false, liveUnivList:list});
    }).catch(function(err){
      setState({liveLoading:false, liveMessage:err.message, liveMessageType:'error'});
    });
  }
  else if (act==='liveUploadUniv'){
    var ufile = $('#liveUnivUploadFile').files && $('#liveUnivUploadFile').files[0];
    var uyear = $('#liveUnivUploadYearInput').value.trim();
    var usheet = $('#liveUnivUploadSheetIdxInput').value.trim();
    if (!ufile || !uyear){ setState({liveMessage:'파일과 연도를 모두 입력해주세요.', liveMessageType:'error'}); return; }
    setState({liveLoading:true, liveMessage:'업로드 중...', liveMessageType:'info'});
    apiUploadUnivBulk(ufile, uyear, usheet).then(function(result){
      setState({liveLoading:false, liveMessage:'대학DB 업로드 완료: '+result.inserted+'건 등록/갱신', liveMessageType:'ok'});
    }).catch(function(err){
      setState({liveLoading:false, liveMessage:'업로드 실패: '+err.message, liveMessageType:'error'});
    });
  }

  // ---- 학생 포털(실제) ----
  else if (act==='pvLookup'){
    var pvNo = $('#pvExamInput').value.trim();
    if (!pvNo){ return; }
    setState({pvLoading:true, pvError:'', pvExamNo:pvNo});
    var pvLookupFn = /^SELF/i.test(pvNo) ? apiPortalSelfHistory(pvNo) : apiPortalLookup(pvNo);
    pvLookupFn.then(function(rows){
      setState({pvLoading:false, pvStage:'lookup', pvLookupResults:rows});
    }).catch(function(err){
      setState({pvLoading:false, pvError:err.message});
    });
  }
  else if (act==='pvBack'){
    setState({
      pvStage:'entry', pvExamNo:'', pvLookupResults:null, pvError:'',
      pvSelfName:'', pvSelfExamNo:null, pvSelfRoundId:null, pvSelfQuestions:null, pvSelfAnswers:{}, pvSelfResult:null,
      pvSubtab:'report', pvWrong:null, pvDeptRank:null, pvUnivMatches:null
    });
  }
  else if (act==='pvToggleAnswers'){
    var paRoundId = parseInt(el.getAttribute('data-round-id'), 10);
    if (state.pvExpandedAnswersRoundId === paRoundId){
      setState({pvExpandedAnswersRoundId: null});
      return;
    }
    setState({pvExpandedAnswersRoundId: paRoundId});
    if (!state.pvAnswersCache[paRoundId]){
      apiPortalStudentAnswers(paRoundId, state.pvExamNo).then(function(answers){
        var cache = Object.assign({}, state.pvAnswersCache);
        cache[paRoundId] = answers;
        setState({pvAnswersCache: cache});
      }).catch(function(err){
        setState({pvError: err.message});
      });
    }
  }
  else if (act==='pvSetSub'){
    var pvSub = el.getAttribute('data-sub');
    setState({pvSubtab: pvSub});
    if (pvSub==='wrong' && state.pvWrong===null){
      apiPortalWrongQuestions(state.pvExamNo).then(function(rows){
        setState({pvWrong: rows});
      }).catch(function(err){
        setState({pvWrong: []});
      });
    }
    if (pvSub==='univ' && state.pvDeptRank===null){
      apiPortalDeptRank(state.pvExamNo).then(function(d){
        setState({pvDeptRank: d || false});
        if (d && d.dept){
          apiGetUnivMaster({ dept_name: d.dept }).then(function(list){
            setState({pvUnivMatches: list});
          }).catch(function(){ setState({pvUnivMatches: []}); });
        }
      }).catch(function(err){
        setState({pvDeptRank: false});
      });
    }
  }
  else if (act==='pvStartSelf'){
    setState({pvStage:'self', pvLoading:true});
    apiPortalPublishedRounds().then(function(rounds){
      setState({pvLoading:false, pvRounds:rounds});
    }).catch(function(err){
      setState({pvLoading:false, liveMessage:err.message, liveMessageType:'error'});
    });
  }
  else if (act==='pvIssueSelfId'){
    var pvName = $('#pvSelfNameInput').value.trim();
    if (!pvName){ return; }
    setState({pvLoading:true});
    apiPortalSelfIssue(pvName).then(function(res){
      setState({pvLoading:false, pvSelfName:res.name, pvSelfExamNo:res.selfExamNo});
    }).catch(function(err){
      setState({pvLoading:false, pvError:err.message});
    });
  }
  else if (act==='pvPickRound'){
    var prSel = $('#pvRoundSelect');
    var prid = prSel ? prSel.value : '';
    if (!prid){ return; }
    setState({pvLoading:true});
    apiPortalRoundQuestions(prid).then(function(qs){
      setState({pvLoading:false, pvSelfRoundId:prid, pvSelfQuestions:qs, pvSelfAnswers:{}});
    }).catch(function(err){
      setState({pvLoading:false, liveMessage:err.message, liveMessageType:'error'});
    });
  }
  else if (act==='pvQuizPick'){
    var pvQno = parseInt(el.getAttribute('data-qno'), 10);
    var pvOpt = el.getAttribute('data-opt');
    var pvAns = Object.assign({}, state.pvSelfAnswers);
    pvAns[pvQno] = pvOpt;
    setState({pvSelfAnswers: pvAns});
  }
  else if (act==='pvQuizSubmit'){
    setState({pvLoading:true, pvError:''});
    apiPortalSelfSubmit({
      self_exam_no: state.pvSelfExamNo,
      name: state.pvSelfName,
      exam_round_id: state.pvSelfRoundId,
      answers: state.pvSelfAnswers
    }).then(function(result){
      setState({pvLoading:false, pvSelfResult:result});
    }).catch(function(err){
      setState({pvLoading:false, pvError:err.message});
    });
  }
});

document.addEventListener('change', function(e){
  var el = e.target;
  if (!el.matches || !el.matches('input[type=file][data-upload]')) return;
  var kind = el.getAttribute('data-upload');
  var roundId = el.getAttribute('data-round-id');
  var file = el.files && el.files[0];
  if (!file) return;
  var extra = {};
  if (kind==='answerKey'){
    var idxEl = document.getElementById('liveAnswerSheetIdx_'+roundId);
    extra.sheetIndex = idxEl ? idxEl.value : '2';
  }
  if (kind==='roster'){
    var idxEl2 = document.getElementById('liveRosterSheetIdx_'+roundId);
    extra.sheetIndex = idxEl2 ? idxEl2.value : '0';
  }
  setState({liveLoading:true, liveMessage:'업로드 중... ('+file.name+')', liveMessageType:'info'});
  apiUploadFile(roundId, kind, file, extra).then(function(result){
    var msg = '';
    if (kind==='omr') msg = 'OMR 업로드 완료: ' + (result.studentCount!==undefined ? result.studentCount+'명 처리, unmatched '+result.unmatchedCount+'명' : (result.message||('상태: '+result.status)));
    else if (kind==='answerKey') msg = '정답지 업로드 완료: 문항 ' + result.questionCount + '개 등록';
    else if (kind==='roster') msg = '명단 업로드 완료: ' + result.studentCount + '명 등록';
    setState({liveLoading:false, liveMessage:msg, liveMessageType:'ok'});
  }).catch(function(err){
    setState({liveLoading:false, liveMessage:'업로드 실패: ' + err.message, liveMessageType:'error'});
  });
});

document.addEventListener('keydown', function(e){
  if ((e.target.id === 'liveUsername' || e.target.id === 'livePassword') && e.key==='Enter'){
    document.querySelector('[data-act="liveLogin"]').click();
  }
  if (e.target.id === 'liveStudentExamInput' && e.key==='Enter'){
    document.querySelector('[data-act="liveSearchStudent"]').click();
  }
  if (e.target.id === 'pvExamInput' && e.key==='Enter'){
    document.querySelector('[data-act="pvLookup"]').click();
  }
  if (e.target.id === 'pvSelfNameInput' && e.key==='Enter'){
    document.querySelector('[data-act="pvIssueSelfId"]').click();
  }
});

// 이전에 로그인해뒀다면(브라우저 localStorage) 새로고침해도 로그인 상태 유지
(function initLiveAuth(){
  var stored = loadStoredAuth();
  if (stored.token){
    state.liveToken = stored.token;
    state.liveAdmin = stored.admin;
  }
})();

renderApp();
})();

</script>
